name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build Python package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: desktop-linux
            qt-libs: "true"
          - os: windows-latest
            asset: desktop-windows
            qt-libs: "false"
          - os: macos-latest
            asset: desktop-macos
            qt-libs: "false"
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Linux Qt runtime libraries
        if: matrix.qt-libs == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            libdbus-1-3 \
            libegl1 \
            libfontconfig1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0
      - name: Build desktop executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip ".[gui,desktop-build]"
          python scripts/build_desktop.py
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/desktop/**

  release:
    needs: [package, desktop]
    if: always() && needs.package.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release-upload
          cp release-artifacts/python-package/* release-upload/
          for d in release-artifacts/desktop-*; do
            if [ -d "$d" ]; then
              (cd "$d" && zip -r "$(pwd)/../../release-upload/$(basename "$d").zip" .)
            fi
          done
          ls -la release-upload/
      - name: Prepare release notes
        run: |
          awk '/^## /{if (flag) exit; flag=1; next} flag' docs/changelog.md > release-notes.md
          head -5 release-notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-upload/*
          body_path: release-notes.md
          generate_release_notes: true
