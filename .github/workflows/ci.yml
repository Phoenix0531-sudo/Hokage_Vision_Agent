name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & unit/integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: System libs (headless Qt / OpenGL)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 || true

      - name: Install package + test extras
        run: |
          python -m pip install --upgrade pip
          # editable install so hokage_vision is importable (src layout)
          pip install -e ".[dev,api,llm]"
          # GUI suite is covered by gui-tests.yml; unit suite should not require Qt
          # but pytest-qt is a dev dep — install essentials so collection is quiet
          pip install "PySide6-Essentials>=6.7" || true

      - name: Required project files
        run: |
          test -f README.md
          test -f LICENSE || test -f LICENSE.md
          test -d src/hokage_vision

      - name: Ruff (critical rules, hard)
        run: ruff check src tests/unit tests/integration --select E9,F63,F7,F82

      - name: Pytest unit + integration (coverage gate 85%)
        run: |
          # packaging wheel/console-script test is flaky on runner isolation; covered by package.yml
          python -m pytest -q tests/unit tests/integration --cov=hokage_vision --cov-report=term --cov-report=xml --cov-fail-under=85

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  security-audit:
    name: pip-audit dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # advisory job: reports known CVEs without blocking the pipeline
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit project dependencies
        run: pip-audit --skip-editable -r requirements-api.txt -r requirements-train.txt 2>&1 | tee pip-audit-report.txt || true
        shell: bash

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.txt
          if-no-files-found: ignore
