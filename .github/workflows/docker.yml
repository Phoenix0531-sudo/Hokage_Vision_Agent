name: Docker

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker targets
        run: docker compose build
      - name: Run core tests
        run: docker compose run --rm test
      - name: Run GUI smoke tests
        run: docker compose run --rm gui-test
      - name: Check API health
        run: |
          docker compose up -d api
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs api
          exit 1
      - name: Stop services
        if: always()
        run: docker compose down --remove-orphans
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push API image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          docker tag hokage-vision-agent:api "$IMAGE:latest"
          docker tag hokage-vision-agent:api "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"
      - name: Tag and push release image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME,,}"
          VERSION="${GITHUB_REF#refs/tags/v}"
          docker tag hokage-vision-agent:api "$IMAGE:latest"
          docker tag hokage-vision-agent:api "$IMAGE:v$VERSION"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:v$VERSION"
